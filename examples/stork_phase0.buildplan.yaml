# =====================================================================================
# Build plan: Flightory Stork, Phase 0 (fixed wing, pusher, hand launch, belly land)
#             + `variants.vtol` overlay (quadplane: 2 booms, 4 lift motors).
# Conforms to schema/buildplan_schema.yaml.  Units SI (m, kg, N, V, A, Ohm), angles in deg.
# Frame: origin = wing-root leading edge on the centreline, +x aft, +y right, +z up.
#
# This single file drives EVERY stage (geometry, mass, fit, aero, CFD, propulsion,
# structures, flight model, SITL, report):  python run.py examples/stork_phase0.buildplan.yaml
#
# Provenance rules: numbers with `source:` containing "estimate"/"assumed" are SOFT inputs and
# are listed in the report (with the gates they drive). Conflicts between the research
# prototypes were resolved in favour of sourced values (see README "Example plan provenance").
# =====================================================================================
meta:
  name: Stork Phase 0
  revision: "0.4"
  phase: "Phase 0 - proof of concept"
  base_design: "Flightory Stork (STORK-USER-MANUAL, Dec 2025)"
  references:
    - https://flightory.com/wp-content/uploads/2025/12/STORK-USER-MANUAL.pdf
  notes: >
    Spar layout inferred from the manual's accessories list (10x1000 main, 8x1000 secondary,
    2x 6x500 wing spars). Tube wall thicknesses are NOT in the manual: 1 mm wall assumed.
    Spanwise placement of the 6 mm tubes, wing z, V-tail size and all fuselage stations are
    ASSUMED - check against the STLs (airframe.cad_import) before trusting the margins.

frames: {datum: "wing root LE, centreline", axes: "x aft, y right, z up"}

airframe:
  lifting_surfaces:
    - name: wing
      kind: wing
      span: 1.62                      # manual
      area: 0.31                      # manual (31 dm2)
      root_chord: 0.230               # manual
      tip_chord: 0.1527               # from S = (cr+ct)/2*b ; MAC 194 mm (manual 195)
      sweep_c4_deg: 0.0               # assumed: straight quarter-chord line
      dihedral_deg: 0.0               # straight 1000 mm spars through the centre section -> flat inner wing
      twist_tip_deg: -1.5             # assumed washout
      x_le_root: 0.0
      z_le_root: 0.022                # assumed: shoulder wing on the ~100 mm fuselage
      sections_per_side: 8
      airfoil: S3021
      thickness_ratio: 0.095
      cl_max: {value: 1.15, source: "estimate, S3021 Re~150k, 3D", uncertainty: 0.1}
      skin: {material: lw_pla_230C, thickness: 0.00045, walls: 1, infill: 0.04}
      spars:
        - {name: main_center, tube: {od: 0.010, id: 0.008, material: cf_pultruded}, y_start: 0.0,  y_end: 0.50, x_c: 0.25, source: "manual 10x1000 (wall assumed)"}
        - {name: rear_center, tube: {od: 0.008, id: 0.006, material: cf_pultruded}, y_start: 0.0,  y_end: 0.50, x_c: 0.55, source: "manual 8x1000 (wall assumed)"}
        - {name: outer_panel, tube: {od: 0.006, id: 0.004, material: cf_pultruded}, y_start: 0.31, y_end: 0.81, x_c: 0.40, source: "manual 6x500 (placement assumed)"}
      control_surfaces:
        - {name: aileron, function: aileron, y_start: 0.38, y_end: 0.78, chord_fraction: 0.25,
           max_defl_deg: 22, horn_arm: 0.012, servo_arm: 0.010, servo: servo_aileron}
    - name: vtail
      kind: v_tail
      span: 0.300                     # per panel, along the panel (assumed; 6x265 tube inside)
      root_chord: 0.150               # assumed
      tip_chord: 0.095                # assumed
      sweep_le_deg: 20                # assumed
      dihedral_deg: 35                # assumed (110 deg included angle)
      x_le_root: 0.440                # assumed
      z_le_root: 0.014
      sections_per_side: 4
      airfoil: NACA0009
      thickness_ratio: 0.09
      skin: {material: lw_pla_230C, thickness: 0.00045, walls: 1, infill: 0.04}
      spars:
        - {name: tail_root, tube: {od: 0.008, id: 0.006, material: cf_pultruded}, y_start: 0.01, y_end: 0.155, x_c: 0.25}
        - {name: tail_main, tube: {od: 0.006, id: 0.004, material: cf_pultruded}, y_start: 0.03, y_end: 0.275, x_c: 0.50}
      control_surfaces:
        - {name: ruddervator, function: ruddervator, y_start: 0.03, y_end: 0.29, chord_fraction: 0.30,
           max_defl_deg: 25, horn_arm: 0.012, servo_arm: 0.010, servo: servo_ruddervator}
  fuselage:
    length: 0.975
    max_width: 0.095
    max_height: 0.100
    x_nose: -0.335
    exponent: 3.0
    # [x, width, height, z_centre] (assumed outer mould line, fits the manual's 220 x 80 x 80 battery bay)
    stations:
      - [-0.335, 0.008, 0.008, -0.005]
      - [-0.331, 0.030, 0.032, -0.005]
      - [-0.320, 0.052, 0.056, -0.004]
      - [-0.305, 0.072, 0.076, -0.003]
      - [-0.290, 0.088, 0.092, -0.002]
      - [-0.240, 0.095, 0.100,  0.000]
      - [ 0.150, 0.095, 0.100,  0.000]
      - [ 0.300, 0.080, 0.086,  0.004]
      - [ 0.450, 0.056, 0.062,  0.010]
      - [ 0.600, 0.042, 0.046,  0.014]
      - [ 0.640, 0.040, 0.044,  0.014]
    skin: {material: lw_pla_230C, thickness: 0.00045, walls: 1, infill: 0.02}
    bays:
      battery_bay:     {center: [-0.150, 0.0, -0.002], size: [0.220, 0.070, 0.078]}   # manual: 220 x 65-80 x 80
      electronics_bay: {center: [ 0.065, 0.0,  0.000], size: [0.205, 0.065, 0.080]}
  landing: {method: belly, sink_rate: 1.5, crush_stroke: 0.010}
  launch: {method: hand, launch_speed: 11.0, launch_load_factor: 3.0}

materials:
  cf_pultruded:
    kind: cfrp_tube
    density: 1550
    E: {value: 1.20e+11, source: "TAP Plastics pultruded tube 134 GPa tensile / 127 GPa flex; 120 GPa used (generic import tubes)", uncertainty: 0.15}
    G: {value: 4.0e+9, source: "estimate, UD pultrusion in-plane shear"}
    strength_flex: {value: 1.37e+9, source: "TAP Plastics pultruded tube flexural strength 200 ksi"}
    strength_tension: {value: 1.65e+9, source: "TAP Plastics"}
    knockdown: 0.45   # unknown-vendor tubes, local crushing at printed sockets, scratches, hygrothermal
    tg_C: 100
    source: https://www.tapplastics.com/image/pdf/Pultruded_Carbon_Rods__Tubes.pdf
  lw_pla_230C:
    kind: printed_polymer
    density: 750       # ~60 % of solid PLA; CNC Kitchen 225 C -> 67 %, 250 C -> 44 %
    E: {value: 1.4e+9, source: "interp. colorFabb TDS (3350 MPa @200C/100%, 860 MPa @250C/45%) & CNC Kitchen bending modulus 1600 MPa @67%", uncertainty: 0.35}
    strength_tension: {value: 2.0e+7, source: "CNC Kitchen 24 MPa @67 % density (horizontal)", uncertainty: 0.35}
    strength_z: {value: 1.0e+7, source: "CNC Kitchen layer adhesion 13 MPa @67 %"}
    knockdown: 0.5
    tg_C: 55
    print: {nozzle_C: 230, walls: 1, flow: 0.6}
    source: https://cnckitchen.com/blog/colorfabb-lw-pla-testing-foaming-pla
  petg:
    kind: printed_polymer
    density: 1270
    E: {value: 1.9e+9, source: "typical PETG FDM, estimate"}
    strength_tension: {value: 4.0e+7, source: "estimate"}
    knockdown: 0.5
    tg_C: 78

components:
  # --- printed structure: masses = geometry shell model (LW-PLA 750 kg/m3, 0.45 mm wall, infill as
  #     above) rounded; estimates until the printed parts are weighed (calibration C0) ---------------
  - {name: fuselage_print, category: structure_printed, geom_part: fuselage, mass: {value: 0.180, source: "estimate: geometry shell model", uncertainty: 0.25}, position: [0.10, 0, 0.0], dims: [0.975, 0.095, 0.10], material: lw_pla_230C, shape: distributed}
  - {name: wing_print_R,   category: structure_printed, geom_part: wing_R,   mass: {value: 0.154, source: "estimate: geometry shell model", uncertainty: 0.25}, position: [0.085, 0.42, 0.024], dims: [0.19, 0.81, 0.018], material: lw_pla_230C, mirror_y: true, shape: distributed}
  - {name: vtail_print_R,  category: structure_printed, geom_part: vtail_R,  mass: {value: 0.033, source: "estimate: geometry shell model", uncertainty: 0.25}, position: [0.53, 0.12, 0.10], dims: [0.12, 0.25, 0.01], material: lw_pla_230C, mirror_y: true, shape: distributed}
  - {name: hatch_misc,     category: structure_printed, mass: {value: 0.015, source: estimate}, position: [-0.15, 0, 0.045], dims: [0.20, 0.06, 0.004], geom: false}
  # --- carbon tubes (mass = od/id/length x 1550 kg/m3) ------------------------------------------
  - {name: spar_10x8x1000, category: structure_tube, geom_spar: main_center, mass: 0.044, position: [0.0575, 0, 0.028], material: cf_pultruded}
  - {name: spar_8x6x1000,  category: structure_tube, geom_spar: rear_center, mass: 0.034, position: [0.120, 0, 0.027], material: cf_pultruded}
  - {name: spar_6x4x500_R, category: structure_tube, geom_spar: outer_panel, mass: 0.012, position: [0.080, 0.56, 0.026], material: cf_pultruded, mirror_y: true}
  - {name: tail_tubes,     category: structure_tube, geom_spar: [tail_root, tail_main], mass: 0.034, position: [0.52, 0, 0.08], material: cf_pultruded}
  - {name: hinge_rods,     category: structure_tube, mass: {value: 0.020, source: "estimate: 3 mm CF rods in aileron/ruddervator hinges"}, position: [0.24, 0, 0.03], geom: false}
  # --- propulsion -------------------------------------------------------------------------------
  - {name: motor_cruise, category: propulsion, part_number: "BrotherHobby Avenger 2812 V5 910KV", mass: {value: 0.0765, source: "getfpv listing 76.5 g"}, position: [0.650, 0, 0.014], dims: [0.030, 0.035, 0.035], shape: cylinder, axis: [1, 0, 0], external: true, thermal_limit_C: 120}
  - {name: prop_cruise,  category: propulsion, part_number: "APC 10x6E", mass: {value: 0.020, source: "APC 10x6E ~20 g"}, position: [0.668, 0, 0.014], geom: false}
  - {name: esc_cruise,   category: propulsion, part_number: "BLHeli_S 40A", mass: 0.036, position: [0.360, 0, -0.012], dims: [0.055, 0.028, 0.012], electrical: {current_cont: 40}}
  # --- energy -----------------------------------------------------------------------------------
  - {name: battery, category: energy, part_number: "4S2P Molicel P50B", mass: {value: 0.600, source: "8 x 69-71 g + nickel/leads"}, position: [-0.210, 0, -0.004], dims: [0.090, 0.046, 0.073], shape: box, bay: battery_bay, thermal_limit_C: 60}
  # --- avionics & payload -------------------------------------------------------------------------
  - {name: flight_controller, category: avionics, part_number: "Matek H743-WING (assumed)", mass: 0.030, position: [0.020, 0, -0.017], dims: [0.045, 0.040, 0.015], bay: electronics_bay}
  - {name: gps,          category: avionics, mass: {value: 0.020, source: estimate}, position: [0.230, 0, 0.040], dims: [0.025, 0.025, 0.008], external: true}
  - {name: airspeed,     category: avionics, mass: {value: 0.010, source: estimate}, position: [-0.285, 0, -0.022], dims: [0.030, 0.020, 0.012]}
  - {name: telemetry_rx, category: avionics, mass: {value: 0.025, source: estimate}, position: [0.110, 0, -0.018], dims: [0.050, 0.030, 0.012], bay: electronics_bay}
  - {name: remote_id,    category: avionics, mass: {value: 0.015, source: estimate}, position: [0.060, 0, 0.015], dims: [0.040, 0.025, 0.010], bay: electronics_bay}
  - {name: pi_zero,      category: payload,  mass: {value: 0.026, source: estimate}, position: [0.000, 0, 0.010], dims: [0.065, 0.030, 0.012], bay: electronics_bay}
  - {name: camera,       category: payload,  mass: {value: 0.003, source: estimate}, position: [-0.310, 0, -0.008], dims: [0.010, 0.025, 0.024]}
  - {name: servo_aileron, category: servo, part_number: "EMAX ES08MA II", mass: 0.012, position: [0.058, 0.56, 0.027], dims: [0.023, 0.025, 0.010], mirror_y: true, torque_stall_Nm: 0.157, supply_V: 4.8}
  - {name: servo_ruddervator, category: servo, part_number: "EMAX ES08MA II", mass: 0.012, position: [0.420, 0.015, 0.008], dims: [0.023, 0.012, 0.025], mirror_y: true, external: true, torque_stall_Nm: 0.157, supply_V: 4.8}
  - {name: wiring,       category: wiring, mass: {value: 0.050, source: estimate}, position: [0.080, 0, -0.033], dims: [0.350, 0.020, 0.008]}
  - {name: hardware,     category: hardware, mass: {value: 0.040, source: "estimate: screws, horns, linkages, glue"}, position: [0.060, 0, 0.010], geom: false}

propulsion:
  units:
    - name: cruise
      role: cruise
      count: 1
      positions: [[0.668, 0, 0.014]]
      thrust_axis: [-1, 0, 0]
      motor:
        model: "BrotherHobby Avenger 2812 V5 910KV"
        kv: {value: 910, source: manual}
        rm: {value: 0.080, source: "estimate: 2810 V5 910KV lists 89 mOhm; 2812 assumed slightly lower", uncertainty: 0.15}
        i0: {value: 0.85, source: "estimate: 2810 V5 0.82 A @10 V", uncertainty: 0.2}
        i0_ref_V: 10
        i_max: 46
        p_max: 1170
        mass: 0.0765
        rotor_inertia: 1.2e-5
        loss_limit_W: 30          # heuristic: ~0.4 W/g in pusher wake
      prop: {model: "APC 10x6E", diameter: 0.254, pitch: 0.1524, blades: 2, data: "embedded:apc_10x6e", ct_scale: 0.92, cp_scale: 1.0, inertia: 2.3e-5}
      esc: {model: "BLHeli_S 40A", i_cont: 40, i_burst: 50, r_on: 0.004}
      wiring: {awg: 14, length: 0.35, connector: XT60, connector_i_cont: 60}

energy:
  cell:
    model: Molicel INR21700-P50B
    chemistry: li_ion_nmc
    capacity_Ah: 5.0
    r_dc: {value: 0.0128, source: "Molicel TDS: 12.8 mOhm DC @50 % SOC (typ.)"}
    i_cont: 60
    v_nom: 3.6
    v_max: 4.2
    v_min: 2.5
    mass: 0.070
  series: 4
  parallel: 2
  pack_wiring_r: 0.006
  usable_fraction: 0.85
  reserve_fraction: 0.20

avionics:
  autopilot: {board: Matek H743-WING, firmware: ArduPlane, firmware_version: "Plane-4.7.2", frame_class: plane}
  sensors: [gps, airspeed_digital, baro, compass]
  avionics_power_W: 4.0
  params:
    AIRSPEED_MIN: 11
    AIRSPEED_MAX: 22
    AIRSPEED_CRUISE: 13
    ROLL_LIMIT_DEG: 45

envelope:
  v_stall_target: 9.0
  v_cruise: 13.0
  v_ne: 25.0
  v_max_level: 22.0
  n_limit_pos: 4.0
  n_limit_neg: -1.5
  fos: 1.5
  gust_u_de: {at_v_cruise: 7.5, at_v_ne: 5.0}
  max_bank_deg: 45

environment_cases:
  - {name: std_day,  altitude_msl: 0,   temperature_C: 15, solar_heating_dT_C: 10, wind_mean: 4, wind_gust: 8, turbulence: light}
  - {name: hot_valley_summer, altitude_msl: 50, temperature_C: 42, solar_heating_dT_C: 20, wind_mean: 6, wind_gust: 11, turbulence: moderate}
  - {name: cold_morning, altitude_msl: 0, temperature_C: 2, solar_heating_dT_C: 0, wind_mean: 3, wind_gust: 6, turbulence: light}

missions:
  - name: canal_inspection_out_and_back
    environment: std_day
    segments:
      - {kind: launch}
      - {kind: climb, altitude: 100}
      - {kind: cruise, distance: 20000, airspeed: 13}
      - {kind: loiter, duration: 300, airspeed: 12}
      - {kind: cruise, distance: 20000, airspeed: 13}
      - {kind: land}
    reserve_fraction: 0.2

analysis:
  cg_target_x: {value: 0.047, source: "manual: CG 47 mm from LE at wing root"}
  cg_tolerance_mac: 0.03
  mass_model: geometry
  static_margin_range: [0.05, 0.20]
  aero: {speeds: [10, 14, 20], excrescence_factor: 1.10, prop_parking: aligned}
  cfd: {kind: wing, alphas_standard: [4], alphas_full: [0, 4, 8], surf_level: [5, 6], iters: 400}
  sitl: {survey_alt: 60, l1_periods_standard: [10, 15], l1_periods_full: [10, 13, 15, 18, 22],
         launch_accel: 25, launch_duration: 0.45}

variants:
  vtol:
    meta: {phase: "Phase 1 - VTOL (quadplane)"}
    airframe:
      booms:
        - {name: boom_R, tube: {shape: square, od: 0.010, id: 0.008, material: cf_pultruded},
           root: [0.30, 0.30, 0.010], supports: [[0.0575, 0.30, 0.010], [0.120, 0.30, 0.010]],
           tip: [-0.20, 0.30, 0.010], tip_mass_components: [lift_pod_FR, lift_pod_RR]}
      landing: {method: vtol, sink_rate: 1.0, crush_stroke: 0.008}
      launch: {method: vtol}
    components_add:
      - {name: boom_R, category: structure_tube, mass: 0.028, position: [0.05, 0.30, 0.010], dims: [0.50, 0.010, 0.010], mirror_y: true, variant_only: vtol, geom: false}
      # each pod = F90 motor 46.6 g + 7in prop 9 g + PETG motor mount 15 g
      - {name: lift_pod_FR, category: propulsion, part_number: "T-Motor F90 1300KV + 7in prop + mount", mass: {value: 0.0706, source: "46.6 g motor (T-Motor) + 9 g prop + 15 g mount (estimate)"}, position: [-0.20, 0.30, 0.026], dims: [0.028, 0.028, 0.022], shape: cylinder, axis: [0, 0, 1], mirror_y: true, external: true}
      - {name: lift_pod_RR, category: propulsion, part_number: "T-Motor F90 1300KV + 7in prop + mount", mass: {value: 0.0706, source: "46.6 g motor (T-Motor) + 9 g prop + 15 g mount (estimate)"}, position: [0.30, 0.30, 0.026], dims: [0.028, 0.028, 0.022], shape: cylinder, axis: [0, 0, 1], mirror_y: true, external: true}
      - {name: lift_escs,   category: propulsion, mass: {value: 0.060, source: estimate}, position: [0.130, 0, 0.022], dims: [0.040, 0.040, 0.010], bay: electronics_bay}
      - {name: lift_wiring, category: wiring, mass: {value: 0.045, source: estimate}, position: [0.05, 0, 0.0], geom: false}
    propulsion_add:
      - name: lift
        role: lift
        count: 4
        positions: [[-0.20, 0.30, 0.046], [0.30, -0.30, 0.046], [-0.20, -0.30, 0.046], [0.30, 0.30, 0.046]]   # ArduPilot quad-X motor order 1..4
        thrust_axis: [0, 0, 1]
        motor: {model: "T-Motor F90 1300KV", kv: 1300, rm: {value: 0.076, source: "T-Motor / flyingtech listing 76 mOhm"}, i0: {value: 0.95, source: "0.95 A @10 V"}, i0_ref_V: 10, i_max: 45.1, p_max: 1059, mass: 0.0466, rotor_inertia: 8.0e-6, loss_limit_W: 35}
        prop: {model: "APC 7x5E (stand-in for 7in lift prop)", diameter: 0.1778, pitch: 0.127, data: "embedded:apc_7x5e", ct_scale: 0.92, cp_scale: 1.0}
        esc: {model: "35A BLHeli_32 (assumed)", i_cont: 35, r_on: 0.004}
        wiring: {awg: 16, length: 0.45, connector: solder, connector_i_cont: 40}
    analysis:
      vtol_auw_cases_kg: [2.2, 2.6, 3.1]
      aero: {prop_parking: crosswise_worst}
    avionics:
      autopilot: {frame_class: quadplane}
      params: {AIRSPEED_MIN: 12}     # heavier VTOL airframe stalls ~1 m/s faster
