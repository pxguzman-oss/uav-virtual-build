# Written by tools/intake.py from the CAD assembly and the parts list. Edit the parts list and re-run,
# or edit here; balance options are added below as variants by tools/balance_apply.py.
meta:
  name: Stork VTOL payload test
  revision: '0.4'
  phase: Phase 1 - VTOL (quadplane)
  base_design: Flightory Stork (STORK-USER-MANUAL, Dec 2025)
  references:
  - https://flightory.com/wp-content/uploads/2025/12/STORK-USER-MANUAL.pdf
  notes: 'Spar layout inferred from the manual''s accessories list (10x1000 main, 8x1000 secondary, 2x 6x500 wing spars). Tube wall thicknesses are NOT in the manual:
    1 mm wall assumed. Spanwise placement of the 6 mm tubes, wing z, V-tail size and all fuselage stations are ASSUMED - check against the STLs (airframe.cad_import)
    before trusting the margins.

    '
  sourcing:
    policy: any
    note: asked at intake
  intake:
    frame:
      origin_mm:
      - 0.0
      - 5.0
      - 335.0
      x_aft: +z
      y_right: +x
      z_up: +y
    frame_confirmed: true
    bodies: 30
    rows: 27
frames:
  datum: wing root LE, centreline
  axes: x aft, y right, z up
airframe:
  lifting_surfaces:
  - name: wing
    kind: wing
    span: 1.62
    area: 0.31
    root_chord: 0.23
    tip_chord: 0.1527
    sweep_c4_deg:
      value: 0.0
      source: 'assumption: straight quarter-chord line (manual gives no sweep)'
      range:
      - -2.0
      - 2.0
    dihedral_deg:
      value: 0.0
      source: 'assumption: flat centre section (straight 1000 mm spars); struct prototype estimated 2 deg'
      range:
      - 0.0
      - 2.0
    twist_tip_deg:
      value: -1.5
      source: 'assumption: washout (not in the manual)'
      range:
      - -3.0
      - 0.0
    x_le_root: 0.0
    z_le_root:
      value: 0.022
      source: 'assumption: shoulder wing on the ~100 mm fuselage'
      range:
      - 0.0
      - 0.035
    sections_per_side: 8
    airfoil: S3021
    thickness_ratio: 0.095
    cl_max:
      value: 1.15
      source: estimate, S3021 Re~150k, 3D
      uncertainty: 0.1
    skin:
      material: lw_pla_230C
      thickness: 0.00045
      walls: 1
      infill: 0.04
    spars:
    - name: main_center
      tube:
        od: 0.01
        id: 0.008
        material: cf_pultruded
      y_start: 0.0
      y_end: 0.5
      x_c: 0.25
      source: manual 10x1000 (wall assumed)
    - name: rear_center
      tube:
        od: 0.008
        id: 0.006
        material: cf_pultruded
      y_start: 0.0
      y_end: 0.5
      x_c: 0.55
      source: manual 8x1000 (wall assumed)
    - name: outer_panel
      tube:
        od: 0.006
        id: 0.004
        material: cf_pultruded
      y_start: 0.31
      y_end: 0.81
      x_c: 0.4
      source: manual 6x500 (placement assumed)
    control_surfaces:
    - name: aileron
      function: aileron
      y_start: 0.38
      y_end: 0.78
      chord_fraction: 0.25
      max_defl_deg: 22
      horn_arm: 0.012
      servo_arm: 0.01
      servo: servo_aileron
  - name: vtail
    kind: v_tail
    span:
      value: 0.3
      source: 'assumption: per panel along the panel (struct prototype had 0.265; 6x265 tube inside)'
      uncertainty: 0.1
    root_chord:
      value: 0.15
      source: assumption (not in the manual)
      uncertainty: 0.1
    tip_chord:
      value: 0.095
      source: assumption (not in the manual)
      uncertainty: 0.1
    sweep_le_deg:
      value: 20
      source: assumption (renders)
      range:
      - 10
      - 30
    dihedral_deg:
      value: 35
      source: 'assumption: 110 deg included angle'
      range:
      - 30
      - 40
    x_le_root:
      value: 0.44
      source: assumption (struct prototype had 0.46)
      range:
      - 0.42
      - 0.46
    z_le_root:
      value: 0.014
      source: assumption
      range:
      - 0.0
      - 0.03
    incidence_deg:
      value: 0.0
      source: 'assumption: V-tail incidence not in the manual (review m8); measure on the printed parts'
      range:
      - -2.0
      - 0.0
    sections_per_side: 4
    airfoil: NACA0009
    thickness_ratio: 0.09
    skin:
      material: lw_pla_230C
      thickness: 0.00045
      walls: 1
      infill: 0.04
    spars:
    - name: tail_root
      tube:
        od: 0.008
        id: 0.006
        material: cf_pultruded
      y_start: 0.01
      y_end: 0.155
      x_c: 0.25
    - name: tail_main
      tube:
        od: 0.006
        id: 0.004
        material: cf_pultruded
      y_start: 0.03
      y_end: 0.275
      x_c: 0.5
    control_surfaces:
    - name: ruddervator
      function: ruddervator
      y_start: 0.03
      y_end: 0.29
      chord_fraction: 0.3
      max_defl_deg: 25
      horn_arm: 0.012
      servo_arm: 0.01
      servo: servo_ruddervator
  fuselage:
    length: 0.975
