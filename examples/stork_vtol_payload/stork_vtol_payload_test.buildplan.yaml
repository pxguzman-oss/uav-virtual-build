    tip_mass_components:
    - lift_pod_FR
    - lift_pod_RR
materials:
  cf_pultruded:
    kind: cfrp_tube
    density: 1550
    E:
      value: 120000000000.0
      source: TAP Plastics pultruded tube 134 GPa tensile / 127 GPa flex; 120 GPa used (generic import tubes)
      uncertainty: 0.15
    G:
      value: 4000000000.0
      source: estimate, UD pultrusion in-plane shear
    strength_flex:
      value: 1370000000.0
      source: TAP Plastics pultruded tube flexural strength 200 ksi
    strength_tension:
      value: 1650000000.0
      source: TAP Plastics
    knockdown: 0.45
    tg_C: 100
    source: https://www.tapplastics.com/image/pdf/Pultruded_Carbon_Rods__Tubes.pdf
  lw_pla_230C:
    kind: printed_polymer
    density: 750
    E:
      value: 1400000000.0
      source: interp. colorFabb TDS (3350 MPa @200C/100%, 860 MPa @250C/45%) & CNC Kitchen bending modulus 1600 MPa @67%
      uncertainty: 0.35
    strength_tension:
      value: 20000000.0
      source: CNC Kitchen 24 MPa @67 % density (horizontal)
      uncertainty: 0.35
    strength_z:
      value: 10000000.0
      source: CNC Kitchen layer adhesion 13 MPa @67 %
    knockdown: 0.5
    tg_C: 55
    print:
      nozzle_C: 230
      walls: 1
      flow: 0.6
    source: https://cnckitchen.com/blog/colorfabb-lw-pla-testing-foaming-pla
  petg:
    kind: printed_polymer
    density: 1270
    E:
      value: 1900000000.0
      source: typical PETG FDM, estimate
    strength_tension:
      value: 40000000.0
      source: estimate
    knockdown: 0.5
    tg_C: 78
