    method: vtol
    sink_rate: 1.0
    crush_stroke: 0.008
  launch:
    method: vtol
    launch_speed:
      value: 11.0
      source: 'estimate: trained overhand throw (measure with phone video)'
      uncertainty: 0.1
    launch_load_factor: 3.0
  booms:
  - name: boom_R
    tube:
      shape: square
      od: 0.01
      id: 0.008
      material: cf_pultruded
    root:
    - 0.3
    - 0.3
    - 0.01
    supports:
    - - 0.0575
      - 0.3
      - 0.01
    - - 0.12
      - 0.3
      - 0.01
    tip:
    - -0.2
    - 0.3
